<!DOCTYPE html><html lang="en" data-t="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeJournal</title>
<style>
:root{--bg:#f1f4f8;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--g:#10b981;--r:#ef4444;--i:#f1f5f9}
[data-t=dark]{--bg:#0b0d10;--c:#14181d;--t:#e5e7eb;--m:#8b94a3;--b:#252b33;--i:#1c2128}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--c);border-right:1px solid var(--b);padding:14px;display:flex;flex-direction:column;gap:2px;overflow:auto;z-index:20;transition:.2s}
aside a{padding:9px 12px;border-radius:8px;color:var(--m);cursor:pointer}aside a.on{background:#10b98122;color:var(--g);font-weight:600}
.lg{font-weight:700;font-size:17px;padding:6px 8px 14px}main{margin-left:230px;padding:24px 32px;max-width:none}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:16px}.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.k{margin:0}.k small{color:var(--m);text-transform:uppercase;font-size:11px;letter-spacing:.04em}.k div{font-size:21px;font-weight:700;margin-top:4px}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--m)}h1{margin:0 0 2px;font-size:24px}
input,select,textarea,button{font:inherit;color:var(--t);background:var(--i);border:1px solid var(--b);border-radius:8px;padding:9px 10px;width:100%}
button{width:auto;cursor:pointer}.pri{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}.dng{color:var(--r);cursor:pointer}
label.f{display:flex;flex-direction:column;gap:4px}label.f span{font-size:12px;color:var(--m)}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}input[type=range]{padding:0}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--m);text-align:left;text-transform:uppercase}td,th{padding:9px 8px;border-bottom:1px solid var(--b);white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover{background:var(--i)}.tw{overflow-x:auto}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--i)}.pill.Win{background:#10b98126;color:var(--g)}.pill.Loss{background:#ef444426;color:var(--r)}
.dz{border:2px dashed var(--b);border-radius:12px;padding:26px;text-align:center;color:var(--m);cursor:pointer;margin-top:10px}.dz.ov{border-color:var(--g)}
.th{width:120px;height:80px;object-fit:cover;border-radius:8px;cursor:zoom-in}.th.big{width:min(100%,560px);height:auto;aspect-ratio:16/9;object-fit:contain;background:var(--i)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cd{min-height:62px;border-radius:8px;background:var(--i);padding:6px;cursor:pointer;font-size:12px;border:1px solid transparent}.cd.w{background:#10b98133}.cd.l{background:#ef444433}.cd.sel{border-color:var(--g)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.hd{margin-bottom:16px}.sp{margin-bottom:12px}
#mb{display:none;margin-bottom:10px}#lb{position:fixed;inset:0;background:#000;display:none;place-items:center;z-index:50}#lb img{width:100vw;height:100vh;object-fit:contain}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.o{transform:none}main{margin:0;padding:14px}#mb{display:block}.cd{min-height:46px}}
</style></head><body>
<aside id="nav"></aside><main><button id="mb" data-x="menu">☰ Menu</button><div id="v"></div></main><div id="lb" data-x="lb"><img><b style="position:fixed;top:12px;right:22px;color:#fff;font-size:30px;cursor:pointer;text-shadow:0 0 6px #000">✕</b></div><input id="imp" type="file" accept=".json" hidden><input id="fi" type="file" accept="image/*" multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== CLOUD SYNC: paste your Supabase values between the quotes (leave empty to use this browser only) =====
const SB_URL='',SB_KEY='';
const $=s=>document.querySelector(s);
let S;const dbp=new Promise((res,rej)=>{const q=indexedDB.open('tj',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const lsSave=()=>{try{localStorage.tj=JSON.stringify(S)}catch{alert('Storage full. Export a backup.')}};
const saveLocal=()=>dbp.then(db=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put(S,'S');tx.onabort=()=>alert('Could not save (storage full?). Export a backup.')}).catch(lsSave);
let sb,user,SM='',T,busy;const save=()=>{saveLocal();clearTimeout(T);T=setTimeout(sync,2500)};
async function load(){let v,m;try{const db=await dbp;v=await new Promise(r=>{const q=db.transaction('s').objectStore('s').get('S');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}
if(!v)try{v=JSON.parse(localStorage.tj);m=1}catch{}
S=v||{};S.trades??=[];S.strats??=[];S.plan??={};S.les??=[];S.set??={theme:'dark',cur:'$',bal:''};navigator.storage?.persist?.();if(m)save()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(n,d=2)=>isFinite(n)?(+n).toFixed(d):'0',money=n=>(n<0?'-':'')+S.set.cur+Math.abs(n).toFixed(2),cls=n=>n>0?'g':n<0?'r':'',pfv=n=>n===Infinity?'∞':f(n);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const head=(t,s,r='')=>`<div class="row hd"><div><h1>${t}</h1><span class=m>${s}</span></div>${r}</div>`;
const card=(t,h)=>`<div class=card>${t?`<h3>${t}</h3>`:''}${h}</div>`,k=(l,v,c='')=>`<div class="card k"><small>${l}</small><div class="${c}">${v}</div></div>`;
const empty=()=>card('No trades yet','<p class=m>Add your first trade and every statistic will appear here.</p><button class=pri data-go=add>Add trade</button>');
const MK=['Forex','Crypto','Stocks','Futures','Indices'],TFS=['1m','5m','15m','30m','1h','4h','Daily','Weekly'],SS=['Asian','London','New York','London/NY overlap','Other'],CATS=['Before Entry','Entry','During Trade','Exit','Annotated Chart','Other'];
const TXT=[['why','Why am I taking this trade?'],['analysis','Market analysis'],['cond','Market condition'],['confirm','Entry confirmation'],['slr','Stop loss reason'],['tpr','Target reason'],['inval','Trade invalidation'],['exp','Expected outcome']];
const FL=[['fomo','FOMO'],['revenge','Revenge trade'],['over','Overtrading'],['movedsl','Moved stop loss'],['early','Closed early'],['broke','Broke rules']];
const SF=[['name','Strategy name','text'],['desc','Description','area'],['cond','Market conditions','area'],['tf','Timeframes','text'],['ind','Indicators used','text'],['entry','Entry rules','area'],['exit','Exit rules','area'],['slr','Stop loss rules','area'],['tpr','Take profit rules','area'],['risk','Risk management rules','area'],['str','Strengths','area'],['weak','Weaknesses','area'],['bt','Backtesting notes','area']];
const PL=[['Trading goals',[['gd','Daily goals'],['gw','Weekly goals'],['gm','Monthly goals'],['gl','Long-term goals']]],['Risk rules',[['rt','Max risk per trade'],['rd','Max daily loss'],['rw','Max weekly loss'],['rn','Max trades per day'],['rc','Max consecutive losses']]],['Trading rules',[['mk','Markets I trade'],['ss','Trading sessions'],['tf','Preferred timeframes'],['su','Setups I trade'],['sa','Setups I avoid']]],['Psychology rules',[['pf','Prevent FOMO'],['pr','Prevent revenge trading'],['po','Prevent overtrading'],['pe','Emotional control']]],['Checklists',[['c1','Pre-trade checklist'],['c2','During-trade checklist'],['c3','Post-trade checklist']]]];
const LF=[['well','What did I do well?'],['wrong','What did I do wrong?'],['learn','What did I learn?'],['improve','What will I improve?'],['repeat','Repeated mistakes'],['rules','Rules I need to follow'],['review','Weekly / monthly review']];
function field(k,l,ty,v,o){v??='';let h;
if(ty=='chk')return`<label class=chk><input type=checkbox name=${k} ${v?'checked':''}> ${l}</label>`;
if(ty=='area')h=`<textarea name=${k} rows=3>${esc(v)}</textarea>`;
else if(ty=='sel')h=`<select name=${k}>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
else if(ty=='range')return`<label class=f><span>${l} <b>${v||5}</b>/10</span><input type=range name=${k} min=1 max=10 value=${v||5}></label>`;
else h=`<input type=${ty} name=${k} value="${esc(v)}" ${o||''}>`;
return`<label class=f><span>${l}</span>${h}</label>`}
const rd=fm=>{const o={};[...fm.elements].forEach(e=>{if(e.name)o[e.name]=e.type=='checkbox'?e.checked:e.value});return o};
const CRY=/BTC|ETH|SOL|XRP|CRYPTO/;
const autoMult=(a,mk)=>{a=String(a).toUpperCase();return a=='XAGUSD'?5000:a=='XAUUSD'?100:(mk=='Crypto'||CRY.test(a))?1:mk=='Forex'?100000:1};
function calc(t){const e=+t.entry||0,x=+t.exit||0,sl=+t.sl||0,tp=+t.tp||0,sz=+t.size||0,m=+t.mult||autoMult(t.asset,t.market),d=t.dir=='Long'?1:-1,bal=+t.bal||0;
const risk=e&&sl?Math.abs(e-sl)*sz*m:0,reward=e&&tp?Math.abs(tp-e)*sz*m:0,pl=e&&x?(x-e)*d*sz*m:0;
return{risk,reward,rr:risk?reward/risk:0,pl,pct:bal?pl/bal*100:0,rpct:bal?risk/bal*100:0,R:risk?pl/risk:0,res:Math.abs(pl)<1e-9?'BE':pl>0?'Win':'Loss'}}
const ps=t=>(+t.conf+ +t.disc+(10-t.fear)+(10-t.greed))/4;
const sorted=a=>[...a].sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
function st(a){a=sorted(a);const w=a.filter(t=>t.res=='Win'),l=a.filter(t=>t.res=='Loss'),sum=x=>x.reduce((s,t)=>s+t.pl,0),gp=sum(w),gl=-sum(l),n=a.length;let eq=0,pk=0,dd=0;a.forEach(t=>{eq+=t.pl;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)});
let s=0,sk='';for(let i=n-1;i>=0;i--){const r=a[i].res;if(r=='BE')continue;if(!sk)sk=r;if(r==sk)s++;else break}
return{a,n,w:w.length,l:l.length,be:n-w.length-l.length,wr:n?w.length/n*100:0,pl:sum(a),pf:gl?gp/gl:(gp?Infinity:0),aw:w.length?gp/w.length:0,al:l.length?-gl/l.length:0,ex:n?sum(a)/n:0,aR:n?a.reduce((s,t)=>s+t.R,0)/n:0,rr:n?a.reduce((s,t)=>s+t.rr,0)/n:0,dd,sk:s?s+(sk=='Win'?'W':'L'):'–',best:n?Math.max(...a.map(t=>t.pl)):0,worst:n?Math.min(...a.map(t=>t.pl)):0}}
const grp=(a,fn)=>{const m={};a.forEach(t=>(m[fn(t)]??=[]).push(t));return Object.entries(m)};
const plBy=(a,fn)=>grp(a,fn).map(([k,v])=>[k,v.reduce((s,t)=>s+t.pl,0)]);
const wk=t=>{const d=new Date(t.date+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return(d.getMonth()+1)+'/'+d.getDate()};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function bars(d,h=190){if(!d.length)return'<p class=m>No data yet</p>';const W=600,pos=Math.max(0,...d.map(x=>x[1])),neg=Math.max(0,...d.map(x=>-x[1])),sc=(h-36)/((pos+neg)||1),y0=10+pos*sc,bw=Math.min(60,(W-20)/d.length-8);
return`<svg viewBox="0 0 ${W} ${h}" width=100%>`+d.map((x,i)=>{const cx=10+(i+.5)*(W-20)/d.length,hh=Math.abs(x[1])*sc;return`<rect x=${cx-bw/2} y=${x[1]>=0?y0-hh:y0} width=${bw} height=${Math.max(hh,1)} rx=3 fill="${x[1]>=0?'var(--g)':'var(--r)'}"><title>${esc(x[0])}: ${f(x[1])}</title></rect><text x=${cx} y=${h-4} text-anchor=middle font-size=11 fill="var(--m)">${esc(String(x[0]).slice(0,10))}</text>`}).join('')+`<line x1=0 x2=${W} y1=${y0} y2=${y0} stroke="var(--b)"/></svg>`}
function line(v){if(v.length<2)return'<p class=m>Add at least 2 trades to see the curve.</p>';const W=600,h=200,mn=Math.min(0,...v),mx=Math.max(0,...v),sx=i=>10+i*(W-20)/(v.length-1),sy=y=>10+(mx-y)*(h-20)/((mx-mn)||1),p=v.map((y,i)=>sx(i)+','+sy(y)).join(' ');
return`<svg viewBox="0 0 ${W} ${h}" width=100%><line x1=0 x2=${W} y1=${sy(0)} y2=${sy(0)} stroke="var(--b)"/><polygon points="${sx(0)},${sy(0)} ${p} ${sx(v.length-1)},${sy(0)}" fill="#10b98122"/><polyline points="${p}" fill=none stroke="var(--g)" stroke-width=2.5 /></svg>`}
function donut(a){const t=a.reduce((s,x)=>s+x[1],0);if(!t)return'<p class=m>No data</p>';let o=0;const C=2*Math.PI*40;
return`<svg viewBox="0 0 120 120" width=170>`+a.map(([n,v,c])=>{const d=v/t*C,e=`<circle r=40 cx=60 cy=60 fill=none stroke="${c}" stroke-width=18 stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=d;return e}).join('')+`</svg><div>`+a.map(([n,v,c])=>`<span style="color:${c}">●</span> ${n} ${v} &nbsp;`).join('')+`</div>`}
const tbl=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table></div>`;
function ttable(a,full){if(!a.length)return'<p class=m>No trades match.</p>';
const R=t=>`<tr class=cl data-go="trade/${t.id}"><td>${t.date}</td><td><b>${esc(t.asset)}</b></td><td class="${t.dir=='Long'?'g':'r'}">${t.dir}</td>`+(full?`<td>${esc(t.strat)}</td><td>${t.entry}</td><td>${t.exit}</td><td>${t.sl}</td><td>${t.tp||'–'}</td><td>1:${f(t.rr)}</td>`:'')+`<td class="${cls(t.pl)}">${money(t.pl)}</td><td class="${cls(t.R)}">${f(t.R)}R</td><td><span class="pill ${t.res}">${t.res}</span></td>`+(full?`<td>${f(ps(t),1)}</td><td>${t.imgs?.length?'📷':''}</td><td><button data-x=edit data-id=${t.id}>Edit</button> <button class=dng data-x=del data-id=${t.id}>Del</button></td>`:'')+'</tr>';
return tbl(full?['Date','Asset','Side','Strategy','Entry','Exit','SL','TP','R:R','P/L','R','Result','Psych','Img','']:['Date','Asset','Dir','P/L','R','Result'],a.map(R))}
/* ---------- views ---------- */
function dash(){const s=st(S.trades),h=head('Dashboard','Your trading performance at a glance','<button class=pri data-go=add>+ Add trade</button>');if(!s.n)return h+empty();let c=0;
return h+`<div class=grid>`+[k('Total trades',s.n),k('Win rate',f(s.wr,1)+'%'),k('Total P/L',money(s.pl),cls(s.pl)),k('Profit factor',pfv(s.pf)),k('Winning',s.w,'g'),k('Losing',s.l,'r'),k('Breakeven',s.be),k('Avg R:R','1:'+f(s.rr)),k('Avg win',money(s.aw),'g'),k('Avg loss',money(s.al),'r'),k('Max drawdown',money(-s.dd),'r'),k('Streak',s.sk),k('Best trade',money(s.best),'g'),k('Worst trade',money(s.worst),'r')].join('')+`</div>`+card('Equity curve',line(s.a.map(t=>c+=t.pl)))+`<div class="grid g2">`+card('Monthly P/L',bars(plBy(s.a,t=>t.date.slice(0,7))))+card('Weekly P/L (week start)',bars(plBy(s.a,wk)))+card('Win / Loss / Breakeven',donut([['Wins',s.w,'#10b981'],['Losses',s.l,'#ef4444'],['BE',s.be,'#64748b']]))+card('Performance by strategy',bars(plBy(s.a,t=>t.strat||'–')))+`</div>`+card('Recent trades',ttable(s.a.slice(-8).reverse()))}
let IM=[];
const lcH=t=>{const c=calc(t);return`<div class=grid>${[['Risk amount',money(c.risk)],['Risk %',f(c.rpct)+'%'],['Potential reward',money(c.reward)],['Planned R:R','1:'+f(c.rr)],['Actual P/L',money(c.pl)],['P/L %',f(c.pct)+'%'],['R multiple',f(c.R)+'R'],['Result',c.res]].map(([a,b])=>k(a,b)).join('')}</div>`};
const thumbs=()=>IM.map((m,i)=>`<div><img class="th big" src="${m.src}"><br><select data-c=${i} style="width:120px;margin-top:4px">${CATS.map(c=>`<option ${c==m.cat?'selected':''}>${c}</option>`).join('')}</select><br><a class=dng data-x=rmimg data-i=${i}>✕ Remove</a></div>`).join('');
const uploader=t=>card(t,`<select id=icat style="width:auto">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class=dz id=dz>Drag &amp; drop, click to browse, or paste with Ctrl+V<br><small>Add as many charts as you want. Category above applies to new uploads; change it per image anytime.</small></div><div id=th class=row style="justify-content:flex-start;margin-top:10px">${thumbs()}</div>`);
const shrink=fl=>new Promise(r=>{if(fl.size<5e6){const q=new FileReader;q.onload=()=>r(q.result);q.readAsDataURL(fl);return}const i=new Image;i.onload=()=>{const s=Math.min(1,3200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.95))};i.src=URL.createObjectURL(fl)});
async function addFiles(fs){for(const fl of fs)if(fl.type.startsWith('image/'))IM.push({cat:$('#icat').value,src:await shrink(fl)});$('#th').innerHTML=thumbs()}
function add(id){const t=id?S.trades.find(x=>x.id==id):{date:today(),bal:S.set.bal,lev:1,mult:'',dir:'Long',market:'Forex',tf:'15m',sess:'London',conf:5,fear:3,greed:3,disc:7,followed:'Yes'};if(!t)return head('Not found','');IM=[...(t.imgs||[])];
const F=(k,l,ty='text',o)=>field(k,l,ty,t[k],o),N=(k,l,r)=>F(k,l,'number','step=any '+(r||''));
return head(id?'Edit trade':'Add trade','Record details, plan and psychology')+`<form id=tf data-id="${id||''}">`+
card('Basic information',`<div class=grid>${F('date','Date','date','required')}${F('time','Time','time')}${F('asset','Asset / pair','text','required placeholder="XAUUSD"')}${F('market','Market','sel',MK)}${F('dir','Direction','sel',['Long','Short'])}${F('strat','Setup / strategy','text','list=sl')}<datalist id=sl>${S.strats.map(s=>`<option>${esc(s.name)}`).join('')}</datalist>${F('tf','Timeframe','sel',TFS)}${F('sess','Session','sel',SS)}</div>`)+
card('Execution',`<div class=grid>${N('entry','Entry price','required')}${N('exit','Exit price','required')}${N('size','Position size (lots/units)','required')}${N('mult','Contract multiplier (blank = auto)','placeholder=Auto')}${F('lev','Leverage','number')}${N('bal','Account balance')}</div>`)+
card('Risk management',`<div class=grid>${N('sl','Stop loss','required')}${N('tp','Take profit / target')}</div><div id=lc style="margin-top:12px">${lcH(t)}</div>`)+
card('Trade plan',`<div class="grid g2">${TXT.map(([a,b])=>F(a,b,'area')).join('')}</div>`)+
card('Trade result',`<div class="grid g2">${F('followed','Did I follow my plan?','sel',['Yes','No'])}${F('exitReason','Actual exit reason')}${F('mistakes','Mistakes made','area')}${F('lessons','Lessons learned','area')}${F('good','What I did well (good things)','area')}</div>`)+
card('Trading psychology',`<div class="grid g2">${F('eb','Emotion before')}${F('ed','Emotion during')}${F('ea','Emotion after')}${F('pnotes','Psychology notes','area')}</div><div class=grid style="margin:12px 0">${F('conf','Confidence','range')}${F('fear','Fear','range')}${F('greed','Greed','range')}${F('disc','Discipline','range')}</div><div class=grid>${FL.map(([a,b])=>F(a,b,'chk')).join('')}</div>`)+
uploader('Chart screenshots')+`<button class=pri>Save trade</button> <button type=button data-go=hist>Cancel</button></form>`}
let H={q:'',asset:'',strat:'',res:'',dir:'',from:'',to:'',sort:'date'};
function hfil(){const q=H.q.toLowerCase();let a=S.trades.filter(t=>(!q||[t.asset,t.strat,t.why,t.mistakes,t.lessons,t.pnotes].join(' ').toLowerCase().includes(q))&&(!H.asset||t.asset==H.asset)&&(!H.strat||t.strat==H.strat)&&(!H.res||t.res==H.res)&&(!H.dir||t.dir==H.dir)&&(!H.from||t.date>=H.from)&&(!H.to||t.date<=H.to));

document.addEventListener('change',async e=>{if(e.target.dataset.c!=null)IM[+e.target.dataset.c].cat=e.target.value;if(e.target.id=='fi'){await addFiles(e.target.files);e.target.value=''}
if(e.target.id=='imp'){try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.trades))throw 0;S=j;S.strats??=[];S.plan??={};S.les??=[];S.set??={theme:'dark',cur:'$',bal:''};save();go()}catch{alert('Invalid backup file')}}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.add('ov')}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#dz'))$('#dz').classList.remove('ov')});
document.addEventListener('drop',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.remove('ov');addFiles(e.dataTransfer.files)}});
document.addEventListener('submit',e=>{e.preventDefault();const fm=e.target,o=rd(fm),id=fm.dataset.id;
if(fm.id=='tf'){if(!o.date||!o.asset.trim()||!(+o.entry)||!(+o.exit)||!(+o.size)||!(+o.sl))return alert('Please fill date, asset, entry, exit, position size and stop loss.');
const t={...(S.trades.find(x=>x.id==id)||{id:uid()}),...o,asset:o.asset.trim().toUpperCase(),strat:o.strat.trim(),...calc(o),imgs:[...IM]};S.trades=S.trades.filter(x=>x.id!=t.id).concat(t);save();location.hash='#/trade/'+t.id}
else if(fm.id=='sf'){if(!o.name.trim())return alert('Strategy name is required.');const s={...(S.strats.find(x=>x.id==id)||{id:uid()}),...o,imgs:[...IM]};S.strats=S.strats.filter(x=>x.id!=s.id).concat(s);save();location.hash='#/strat'}
else if(fm.id=='pf'){S.plan=o;save();alert('Plan saved ✔')}
else if(fm.id=='lf'){S.les.push({id:uid(),date:today(),...o});save();go()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#lb').style.display='none'});
load().then(()=>{go();cloudInit()});
</script></body></html>
